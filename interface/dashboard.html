<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FALCON Founder Console</title><style>body{font:15px system-ui;background:#080d12;color:#dce7ef;max-width:1100px;margin:24px auto;padding:0 14px}h1{margin-bottom:4px}.muted{color:#91a6b8}.ok{color:#65e6a5}.bad{color:#ff8c8c}section{border:1px solid #263746;border-radius:14px;padding:18px;margin:14px 0;background:#0d151d}textarea,input{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #314555;background:#071018;color:#e7f0f6}textarea{min-height:90px;resize:vertical}button{padding:11px 16px;border:0;border-radius:10px;cursor:pointer;font-weight:700}#row{display:grid;grid-template-columns:1fr auto;gap:10px}.msg{padding:12px;border-radius:10px;margin:8px 0;white-space:pre-wrap}.founder{background:#122132}.falcon{background:#10251e}.sys{background:#231f15}.meta{font-size:12px;color:#91a6b8;margin-bottom:4px}#log{font-family:ui-monospace,monospace;white-space:pre-wrap;max-height:360px;overflow:auto;font-size:12px}@media(max-width:650px){#row{grid-template-columns:1fr}}</style></head><body><h1>FALCON <span id="live" class="muted">● CONNECTING</span></h1><div class="muted">Founder Direct Console — no ChatGPT relay</div><section id="authBox" style="display:none"><b>Founder Authentication</b><p class="muted">Enter your Founder token for this browser session. It is kept only in session storage.</p><div id="row"><input id="token" type="password" placeholder="Founder token"><button onclick="saveToken()">Connect</button></div></section><section><b>Founder ↔ Falcon</b><div id="chat"><div class="msg sys"><div class="meta">SYSTEM</div>Direct channel ready. Give Falcon a mission.</div></div><textarea id="m" placeholder="Give Falcon a mission. Ctrl+Enter to send."></textarea><p><button id="sendBtn" onclick="send()">Send directly to Falcon</button></p></section><section><b>Live Activity</b><div id="log">Waiting for runtime activity…</div></section><script>const api=location.protocol==='file:'?'http://localhost:8080':location.origin;let authRequired=false;function getToken(){return sessionStorage.getItem('falconFounderToken')||''}function headers(){let h={'Content-Type':'application/json'},t=getToken();if(t)h.Authorization='Bearer '+t;return h}function add(role,text,cls){let d=document.createElement('div');d.className='msg '+cls;d.innerHTML='<div class="meta">'+role+'</div>';d.append(document.createTextNode(text));chat.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'})}function saveToken(){sessionStorage.setItem('falconFounderToken',token.value.trim());token.value='';authBox.style.display='none';load()}async function session(){try{let j=await(await fetch(api+'/session')).json();authRequired=!!j.founder_auth_required;authBox.style.display=authRequired&&!getToken()?'block':'none';live.textContent='● LIVE';live.className='ok'}catch(e){live.textContent='● OFFLINE';live.className='bad'}}async function send(){let objective=m.value.trim();if(!objective)return;if(authRequired&&!getToken()){authBox.style.display='block';return}add('FOUNDER',objective,'founder');m.value='';sendBtn.disabled=true;try{let r=await fetch(api+'/missions',{method:'POST',headers:headers(),body:JSON.stringify({objective})});let j=await r.json();if(r.status===401){sessionStorage.removeItem('falconFounderToken');authBox.style.display='block';add('SYSTEM','Founder authentication required.','sys');return}if(!r.ok){add('FALCON','Mission rejected: '+JSON.stringify(j),'falcon');return}let mission=j.mission||{};add('FALCON','Mission '+(mission.status||mission.state||'ACCEPTED')+'\nID: '+(mission.mission_id||'n/a'),'falcon');load()}catch(e){add('SYSTEM','Falcon runtime offline: '+e,'sys')}finally{sendBtn.disabled=false}}async function load(){try{let r=await fetch(api+'/activity',{headers:headers()});if(r.status===401){authBox.style.display='block';return}let j=await r.json();log.textContent=(j.events||[]).map(e=>`${e.timestamp||''}  ${e.event_type||''}  ${e.source||''} → ${e.target||'*'}  ${JSON.stringify(e.payload||{})}`).join('\n')||'No activity yet'}catch(e){log.textContent='Runtime offline: '+e}}m.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')send()});session();setInterval(load,2000);load()</script></body></html>
