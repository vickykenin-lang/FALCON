<!doctype html><html><head><meta charset="utf-8"><title>FALCON LIVE</title><style>body{font:15px system-ui;background:#080d12;color:#dce7ef;max-width:1000px;margin:30px auto}section{border:1px solid #263746;border-radius:12px;padding:18px;margin:14px 0}input{width:75%;padding:12px}button{padding:12px}#log{font-family:monospace;white-space:pre-wrap}.ok{color:#65e6a5}</style></head><body><h1>FALCON <span class="ok">● LIVE</span></h1><section><b>Founder → Falcon</b><p><input id="m" placeholder="Give Falcon a mission"><button onclick="send()">Assign</button></p></section><section><b>Live Activity</b><div id="log">Connecting…</div></section><script>const api=location.protocol==='file:'?'http://localhost:8080':location.origin;async function send(){let objective=m.value.trim();if(!objective)return;await fetch(api+'/missions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({objective})});m.value='';load()}async function load(){try{let j=await(await fetch(api+'/activity')).json();log.textContent=j.events.map(e=>`${e.timestamp}  ${e.event_type}  ${e.source} → ${e.target||'*'}  ${JSON.stringify(e.payload)}`).join('\n')||'No activity yet'}catch(e){log.textContent='Runtime offline: '+e}}setInterval(load,2000);load()</script></body></html>
