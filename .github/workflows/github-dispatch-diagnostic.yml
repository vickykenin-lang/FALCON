name: Falcon GitHub Dispatch Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-dispatch-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FALCON_GITHUB_TOKEN: ${{ secrets.FALCON_GITHUB_TOKEN }}
      FOUNDER_CHAT_ID: '1311732972'
    steps:
      - name: Verify workflow dispatch permission
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          token = os.environ.get('FALCON_GITHUB_TOKEN','').strip()
          if not token:
              raise SystemExit('FALCON_GITHUB_TOKEN_missing')
          update_id = f"token-diag-{int(time.time())}"
          payload = json.dumps({
              'ref': 'main',
              'inputs': {
                  'kind': 'health',
                  'objective': '/health',
                  'chat_id': os.environ['FOUNDER_CHAT_ID'],
                  'update_id': update_id,
              }
          }).encode()
          req = Request(
              'https://api.github.com/repos/vickykenin-lang/FALCON/actions/workflows/cloudflare-task.yml/dispatches',
              data=payload,
              method='POST',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'falcon-token-diagnostic',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          try:
              with urlopen(req, timeout=20) as response:
                  status = response.status
          except HTTPError as exc:
              body = exc.read().decode(errors='replace')[:300]
              print(json.dumps({'dispatch_status': exc.code, 'response_prefix': body}))
              raise SystemExit(f'github_dispatch_token_failed:{exc.code}')
          print(json.dumps({'dispatch_status': status, 'accepted': status == 204}))
          if status != 204:
              raise SystemExit(f'github_dispatch_unexpected_status:{status}')
          PY
