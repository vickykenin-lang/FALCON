name: Falcon Cloudflare Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WORKER_URL: https://falcon-gateway.vickykenin.workers.dev
      FOUNDER_ID: '1311732972'
      FALCON_TELEGRAM_BOT_TOKEN: ${{ secrets.FALCON_TELEGRAM_BOT_TOKEN }}
      FALCON_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.FALCON_TELEGRAM_WEBHOOK_SECRET }}
      GH_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Diagnose webhook and queue path
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          worker = os.environ['WORKER_URL'].rstrip('/')
          token = os.environ.get('FALCON_TELEGRAM_BOT_TOKEN','')
          secret = os.environ.get('FALCON_TELEGRAM_WEBHOOK_SECRET','')
          founder = int(os.environ['FOUNDER_ID'])
          gh = os.environ['GH_READ_TOKEN']
          if not token or not secret:
              raise SystemExit('required_diagnostic_secret_missing')

          evidence = {}
          started = datetime.now(timezone.utc)

          # 1) Public Worker health, capture bounded 403 details if Cloudflare blocks before Worker code.
          try:
              with urlopen(Request(worker + '/health', headers={'User-Agent':'falcon-diagnostic'}), timeout=20) as r:
                  raw = r.read().decode(errors='replace')
                  evidence['worker_health_status'] = r.status
                  evidence['worker_content_type'] = r.headers.get('content-type','')
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {}
                  evidence['worker_health'] = body.get('status')
          except HTTPError as exc:
              raw = exc.read().decode(errors='replace')
              evidence['worker_health_status'] = exc.code
              evidence['worker_content_type'] = exc.headers.get('content-type','')
              evidence['worker_server'] = exc.headers.get('server','')
              evidence['worker_location_present'] = bool(exc.headers.get('location'))
              low = raw.lower()
              evidence['looks_like_cloudflare_access'] = ('cloudflare access' in low or '/cdn-cgi/access/' in low or 'access denied' in low)
              evidence['looks_like_challenge'] = ('just a moment' in low or 'challenge-platform' in low or 'cf-chl-' in low)
              evidence['body_prefix'] = raw[:180].replace('\n',' ')
              with open('cloudflare-diagnostic.json','w',encoding='utf-8') as f:
                  json.dump(evidence, f, indent=2)
              print(json.dumps(evidence))
              raise SystemExit('worker_public_route_blocked')

          if evidence.get('worker_health_status') != 200 or evidence.get('worker_health') != 'HEALTHY':
              with open('cloudflare-diagnostic.json','w',encoding='utf-8') as f:
                  json.dump(evidence, f, indent=2)
              raise SystemExit('worker_health_failed')

          # 2) Telegram webhook registration, sanitized.
          with urlopen(Request(f'https://api.telegram.org/bot{token}/getWebhookInfo'), timeout=20) as r:
              info = json.loads(r.read().decode()).get('result') or {}
          expected = worker + '/telegram/webhook'
          evidence['telegram_webhook_matches'] = info.get('url') == expected
          evidence['telegram_pending_updates'] = info.get('pending_update_count', 0)
          evidence['telegram_last_error'] = bool(info.get('last_error_message'))
          evidence['telegram_last_error_message'] = str(info.get('last_error_message') or '')[:160]
          if not evidence['telegram_webhook_matches']:
              with open('cloudflare-diagnostic.json','w',encoding='utf-8') as f:
                  json.dump(evidence, f, indent=2)
              raise SystemExit('telegram_webhook_url_mismatch')

          # 3) Authenticated synthetic Telegram update into the real Worker.
          synthetic_id = int(time.time())
          payload = json.dumps({
              'update_id': synthetic_id,
              'message': {
                  'message_id': synthetic_id,
                  'from': {'id': founder, 'is_bot': False, 'first_name': 'Founder'},
                  'chat': {'id': founder, 'type': 'private'},
                  'date': synthetic_id,
                  'text': '/health',
              },
          }).encode()
          req = Request(worker + '/telegram/webhook', data=payload, method='POST', headers={
              'Content-Type': 'application/json',
              'X-Telegram-Bot-Api-Secret-Token': secret,
              'User-Agent': 'falcon-diagnostic',
          })
          with urlopen(req, timeout=20) as r:
              accepted = json.loads(r.read().decode())
              evidence['synthetic_webhook_status'] = r.status
              evidence['synthetic_queued'] = bool(accepted.get('queued'))
          if evidence['synthetic_webhook_status'] != 200 or not evidence['synthetic_queued']:
              with open('cloudflare-diagnostic.json','w',encoding='utf-8') as f:
                  json.dump(evidence, f, indent=2)
              raise SystemExit('worker_webhook_queue_rejected')

          # 4) Allow Queue consumer time to dispatch GitHub Actions, then verify a new task run exists.
          time.sleep(12)
          api = 'https://api.github.com/repos/vickykenin-lang/FALCON/actions/runs?per_page=20'
          req = Request(api, headers={
              'Authorization': f'Bearer {gh}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'falcon-cloudflare-diagnostic',
          })
          with urlopen(req, timeout=20) as r:
              runs = json.loads(r.read().decode()).get('workflow_runs') or []
          seen = False
          for run in runs:
              if run.get('name') != 'Falcon Cloudflare Task':
                  continue
              created = run.get('created_at') or ''
              try:
                  created_dt = datetime.fromisoformat(created.replace('Z','+00:00'))
              except Exception:
                  continue
              if created_dt >= started:
                  seen = True
                  evidence['cloudflare_task_run_id'] = run.get('id')
                  evidence['cloudflare_task_status'] = run.get('status')
                  break
          evidence['cloudflare_task_seen'] = seen
          with open('cloudflare-diagnostic.json','w',encoding='utf-8') as f:
              json.dump(evidence, f, indent=2)
          print(json.dumps(evidence))
          if not seen:
              raise SystemExit('queue_consumer_github_dispatch_not_seen')
          PY
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falcon-cloudflare-diagnostic
          path: cloudflare-diagnostic.json
          if-no-files-found: warn
          retention-days: 3
