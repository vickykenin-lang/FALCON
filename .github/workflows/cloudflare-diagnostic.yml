name: Falcon Cloudflare Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      WORKER_URL: https://falcon-gateway.vickykenin.workers.dev
      FOUNDER_ID: '1311732972'
      FALCON_TELEGRAM_BOT_TOKEN: ${{ secrets.FALCON_TELEGRAM_BOT_TOKEN }}
      FALCON_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.FALCON_TELEGRAM_WEBHOOK_SECRET }}
      GH_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Certify live webhook queue dedupe execution and Telegram return path
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          worker=os.environ['WORKER_URL'].rstrip('/'); token=os.environ['FALCON_TELEGRAM_BOT_TOKEN']; secret=os.environ['FALCON_TELEGRAM_WEBHOOK_SECRET']; founder=int(os.environ['FOUNDER_ID']); gh=os.environ['GH_READ_TOKEN']
          evidence={}; started=datetime.now(timezone.utc)
          def write():
              with open('cloudflare-diagnostic.json','w',encoding='utf-8') as f: json.dump(evidence,f,indent=2)
          def gh_runs():
              req=Request('https://api.github.com/repos/vickykenin-lang/FALCON/actions/runs?per_page=50',headers={'Authorization':f'Bearer {gh}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'falcon-closure-cert'})
              with urlopen(req,timeout=20) as r:return json.loads(r.read().decode()).get('workflow_runs') or []

          with urlopen(Request(worker+'/health',headers={'User-Agent':'falcon-closure-cert'}),timeout=20) as r:
              body=json.loads(r.read().decode()); evidence['worker_health_status']=r.status; evidence['worker_health']=body.get('status')
          assert evidence['worker_health_status']==200 and evidence['worker_health']=='HEALTHY','worker_health_failed'

          with urlopen(Request(f'https://api.telegram.org/bot{token}/getWebhookInfo'),timeout=20) as r: info=json.loads(r.read().decode()).get('result') or {}
          evidence['telegram_webhook_matches']=info.get('url')==worker+'/telegram/webhook'; evidence['telegram_last_error']=bool(info.get('last_error_message'))
          assert evidence['telegram_webhook_matches'],'telegram_webhook_url_mismatch'

          synthetic_id=int(time.time())
          payload=json.dumps({'update_id':synthetic_id,'message':{'message_id':synthetic_id,'from':{'id':founder,'is_bot':False,'first_name':'Founder'},'chat':{'id':founder,'type':'private'},'date':synthetic_id,'text':'Inspect vickykenin-lang/FALCON repository identity using governed read capability. Do not modify anything.'}}).encode()
          headers={'Content-Type':'application/json','X-Telegram-Bot-Api-Secret-Token':secret,'User-Agent':'falcon-closure-cert'}
          accepted=[]
          for _ in range(2):
              with urlopen(Request(worker+'/telegram/webhook',data=payload,method='POST',headers=headers),timeout=20) as r: accepted.append(json.loads(r.read().decode()))
          evidence['duplicate_same_update_submitted']=True
          evidence['webhook_responses']=[{'queued':bool(x.get('queued')),'duplicate':bool(x.get('duplicate'))} for x in accepted]
          evidence['ingress_dedupe_verified']=len(accepted)==2 and accepted[0].get('queued') is True and accepted[0].get('duplicate') is False and accepted[1].get('queued') is False and accepted[1].get('duplicate') is True

          matching=[]; deadline=time.time()+120
          while time.time()<deadline:
              matching=[]
              for run in gh_runs():
                  if run.get('name')!='Falcon Cloudflare Task':continue
                  try: created=datetime.fromisoformat((run.get('created_at') or '').replace('Z','+00:00'))
                  except Exception:continue
                  if created>=started: matching.append(run)
              if matching and all(r.get('status')=='completed' for r in matching):break
              time.sleep(5)
          evidence['new_cloudflare_task_run_count']=len(matching)
          evidence['duplicate_dispatch_prevented']=len(matching)==1
          if matching:
              run=matching[0]; evidence['cloudflare_task_run_id']=run.get('id'); evidence['cloudflare_task_status']=run.get('status'); evidence['cloudflare_task_conclusion']=run.get('conclusion')
          evidence['live_mission_execution_verified']=bool(matching) and matching[0].get('conclusion')=='success'
          write(); print(json.dumps(evidence))
          assert evidence['ingress_dedupe_verified'],'worker_ingress_dedupe_not_live'
          assert evidence['duplicate_dispatch_prevented'],'duplicate_update_dispatched_more_than_once'
          assert evidence['live_mission_execution_verified'],'live_cloudflare_task_not_successful'
          PY
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falcon-cloudflare-diagnostic
          path: cloudflare-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
