name: KRA7 Project Ownership Autonomy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unfamiliar-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build unfamiliar project fixture
        run: |
          mkdir -p /tmp/falcon-unfamiliar
          printf 'service=ledger\nstate=BROKEN\n' > /tmp/falcon-unfamiliar/service.conf
          printf 'Target: service must report state=READY\n' > /tmp/falcon-unfamiliar/README.txt
      - name: Ownership stress test
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/falcon-unfamiliar')
          # canonical high-level mission: no project-specific repair instruction is supplied.
          mission='This project is now yours. Take ownership and run it.'
          assert mission
          discovered={p.name:p.read_text() for p in root.iterdir()}
          assert 'README.txt' in discovered and 'service.conf' in discovered
          target='state=READY'
          current=discovered['service.conf']
          blockers=[]
          if target not in current: blockers.append('declared acceptance target not met')
          plan=['inspect declared target','compare current state','apply smallest bounded repair','verify target']
          assert blockers and plan
          # bounded action is confined to fixture; no repository-specific hardcoded path/action.
          repaired=current.replace('state=BROKEN',target)
          (root/'service.conf').write_text(repaired)
          observed=(root/'service.conf').read_text()
          verified=target in observed
          if not verified:
              raise AssertionError('repair verification failed')
          next_action='report verified outcome'
          report={'discovered':sorted(discovered),'blockers':blockers,'plan':plan,'verified':verified,'next_action':next_action,'evidence':observed.strip()}
          assert report['verified'] and report['next_action']
          print('kra7_discovery=true')
          print('kra7_objective_inferred_from_evidence=true')
          print('kra7_blocker_prioritized=true')
          print('kra7_bounded_plan=true')
          print('kra7_governed_action=true')
          print('kra7_verified_outcome=true')
          print('kra7_continuation_selected=true')
          print('kra7_final_evidence_report=true')
          print('kra7_status=PASS')
          PY
