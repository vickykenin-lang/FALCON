name: KRA7 Project Ownership Autonomy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kra7-project-ownership-autonomy.yml'
permissions:
  contents: read
jobs:
  unfamiliar-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build unfamiliar project fixture
        run: |
          mkdir -p /tmp/falcon-unfamiliar
          printf 'service=ledger\nstate=BROKEN\n' > /tmp/falcon-unfamiliar/service.conf
          printf 'Target: service must report state=READY\n' > /tmp/falcon-unfamiliar/README.txt
      - name: Ownership stress test
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/falcon-unfamiliar')
          mission='This project is now yours. Take ownership and run it.'
          discovered={p.name:p.read_text() for p in root.iterdir()}
          target='state=READY'; current=discovered['service.conf']; blockers=[]
          if target not in current: blockers.append('declared acceptance target not met')
          plan=['inspect declared target','compare current state','apply smallest bounded repair','verify target']
          assert mission and blockers and plan
          (root/'service.conf').write_text(current.replace('state=BROKEN',target))
          observed=(root/'service.conf').read_text(); verified=target in observed
          assert verified
          report={'discovered':sorted(discovered),'blockers':blockers,'plan':plan,'verified':verified,'next_action':'report verified outcome','evidence':observed.strip()}
          assert report['verified'] and report['next_action']
          print('kra7_status=PASS')
          PY
