name: Falcon Telegram Connectivity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-connectivity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FALCON_TELEGRAM_BOT_TOKEN: ${{ secrets.FALCON_TELEGRAM_BOT_TOKEN }}
      FALCON_TELEGRAM_ALLOWED_USER_ID: ${{ secrets.FALCON_TELEGRAM_ALLOWED_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Telegram bot and Founder channel
        run: |
          python - <<'PY'
          from interface.telegram import TelegramConfig, TelegramClient
          cfg = TelegramConfig.from_env()
          client = TelegramClient(cfg.bot_token)
          me = client.get_me()
          username = str(me.get('username') or '')
          if username.lower() != 'falcon_optimus_bot':
              raise SystemExit(f'unexpected_bot_username:{username}')

          updates = client.get_updates(timeout=0)
          private_senders = []
          for update in updates:
              message = update.get('message') or {}
              sender = message.get('from') or {}
              chat = message.get('chat') or {}
              text = str(message.get('text') or '').strip()
              if chat.get('type') == 'private' and isinstance(sender.get('id'), int):
                  private_senders.append((sender['id'], text))

          configured_seen = any(sender_id == cfg.allowed_user_id for sender_id, _ in private_senders)
          start_senders = {sender_id for sender_id, text in private_senders if text.startswith('/start')}
          print('telegram_bot_verified=true')
          print(f'private_updates_seen={len(private_senders)}')
          print(f'configured_founder_seen={str(configured_seen).lower()}')
          print(f'unique_start_senders={len(start_senders)}')

          if start_senders and cfg.allowed_user_id not in start_senders:
              raise SystemExit('configured_founder_id_does_not_match_recent_start_sender')

          client.send_message(cfg.allowed_user_id, 'FALCON DIRECT: Telegram credentials verified. Founder channel reachable.')
          print('founder_channel_message_sent=true')
          PY
