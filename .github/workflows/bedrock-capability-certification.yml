name: Bedrock Capability Certification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-bedrock-mantle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      OPENAI_BASE_URL: https://bedrock-mantle.us-east-1.api.aws/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install client
        run: python -m pip install --upgrade 'openai>=2,<3'
      - name: Verify secret injection
        run: |
          python - <<'PY'
          import os
          assert os.environ.get('OPENAI_API_KEY'), 'BEDROCK_API_KEY missing/empty'
          assert os.environ.get('OPENAI_BASE_URL') == 'https://bedrock-mantle.us-east-1.api.aws/v1'
          print('credential_injected=true')
          print('mantle_endpoint_configured=true')
          PY
      - name: Discover full Mantle inventory and certify text models
        run: |
          python - <<'PY'
          import json, os, re
          from openai import OpenAI

          client = OpenAI(api_key=os.environ['OPENAI_API_KEY'], base_url=os.environ['OPENAI_BASE_URL'], timeout=90.0)
          evidence = {
            'credential_available': True,
            'configured': True,
            'endpoint': os.environ['OPENAI_BASE_URL'],
            'model_discovery_verified': False,
            'tests': [],
            'notes': [
              'Visibility is not treated as inference success.',
              'Media/embedding models that require InvokeModel/async APIs are inventory-only in this Mantle workflow and require separate certification.'
            ]
          }

          models = client.models.list()
          ids = sorted({m.id for m in models.data})
          evidence['model_discovery_verified'] = True
          evidence['model_count'] = len(ids)
          evidence['models'] = ids

          def provider(mid):
            return mid.split('.', 1)[0] if '.' in mid else 'unknown'
          groups = {}
          for mid in ids:
            groups.setdefault(provider(mid), []).append(mid)
          evidence['providers'] = groups

          print('model_discovery_verified=true')
          print('model_count=' + str(len(ids)))
          print('=== AUTHENTICATED MODEL INVENTORY ===')
          for p in sorted(groups):
            print(f'[{p}]')
            for mid in groups[p]: print(mid)

          # Candidate IDs are selected only if actually returned by authenticated /models.
          patterns = [
            ('qwen_coder', [r'^qwen\.qwen3-coder-next$', r'qwen.*coder']),
            ('openai_reasoning', [r'^openai\.gpt-5\.6-sol$', r'openai.*gpt-5\.6.*sol', r'openai.*gpt-5', r'openai.*gpt-oss']),
            ('anthropic_reasoning', [r'anthropic.*sonnet', r'anthropic.*opus', r'anthropic.*haiku']),
            ('vision_candidate', [r'qwen.*vl', r'nvidia.*vl', r'kimi.*2\.5']),
          ]

          selected = {}
          for role, pats in patterns:
            for pat in pats:
              hit = next((mid for mid in ids if re.search(pat, mid, re.I)), None)
              if hit:
                selected[role] = hit
                break
          evidence['selected_candidates'] = selected
          print('selected_candidates=' + json.dumps(selected, sort_keys=True))

          # Safe text-only smoke tests. Vision semantics get a separate real-image test later.
          for role in ('qwen_coder', 'openai_reasoning', 'anthropic_reasoning'):
            mid = selected.get(role)
            if not mid:
              evidence['tests'].append({'role': role, 'visible': False, 'live_request_verified': False, 'real_output_verified': False})
              continue
            result = {'role': role, 'model': mid, 'visible': True, 'live_request_verified': False, 'real_output_verified': False}
            try:
              response = client.chat.completions.create(
                model=mid,
                messages=[{'role':'user','content':'Return exactly this token and nothing else: FALCON_CERT_OK'}],
                max_tokens=80,
                temperature=0,
              )
              text = (response.choices[0].message.content or '').strip()
              result['live_request_verified'] = True
              result['real_output_verified'] = bool(text)
              result['output_match'] = 'FALCON_CERT_OK' in text
              result['output_preview'] = text[:160]
            except Exception as exc:
              result['error_type'] = type(exc).__name__
              result['error'] = str(exc)[:800]
            evidence['tests'].append(result)
            print(f"test role={role} model={mid} live={result['live_request_verified']} output={result['real_output_verified']} match={result.get('output_match', False)}")

          with open('bedrock-capability-inventory.json','w',encoding='utf-8') as f:
            json.dump(evidence,f,indent=2)
          PY
      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-capability-inventory
          path: bedrock-capability-inventory.json
          retention-days: 14
