name: Bedrock Capability Certification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-bedrock-mantle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      OPENAI_BASE_URL: https://bedrock-mantle.us-east-1.api.aws/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenAI client
        run: python -m pip install --upgrade 'openai>=2,<3'
      - name: Verify secret injection
        run: |
          python - <<'PY'
          import os
          assert os.environ.get('OPENAI_API_KEY'), 'BEDROCK_API_KEY missing/empty'
          assert os.environ.get('OPENAI_BASE_URL') == 'https://bedrock-mantle.us-east-1.api.aws/v1'
          print('credential_injected=true')
          print('mantle_endpoint_configured=true')
          PY
      - name: Discover authenticated Mantle models and run live inference
        run: |
          python - <<'PY'
          import json, os
          from openai import OpenAI

          client = OpenAI(
              api_key=os.environ['OPENAI_API_KEY'],
              base_url=os.environ['OPENAI_BASE_URL'],
              timeout=60.0,
          )
          evidence = {
              'credential_available': True,
              'configured': True,
              'endpoint': os.environ['OPENAI_BASE_URL'],
              'model_discovery_attempted': True,
              'model_discovery_verified': False,
              'qwen_coder_next_visible': False,
              'live_request_verified': False,
              'real_output_verified': False,
          }
          try:
              models = client.models.list()
              ids = sorted({m.id for m in models.data})
              evidence['model_discovery_verified'] = True
              evidence['model_count'] = len(ids)
              evidence['models'] = ids
              evidence['qwen_coder_next_visible'] = 'qwen.qwen3-coder-next' in ids
              print('model_discovery_verified=true')
              print('model_count=' + str(len(ids)))
              print('qwen_coder_next_visible=' + str(evidence['qwen_coder_next_visible']).lower())

              preferred = ['qwen.qwen3-coder-next', 'zai.glm-4.7-flash']
              selected = next((m for m in preferred if m in ids), None)
              evidence['selected_model'] = selected
              if selected:
                  response = client.chat.completions.create(
                      model=selected,
                      messages=[{'role':'user','content':'Reply with exactly: FALCON_BEDROCK_OK'}],
                      max_tokens=64,
                      temperature=0,
                  )
                  text = (response.choices[0].message.content or '').strip()
                  evidence['live_request_verified'] = True
                  evidence['real_output_verified'] = bool(text)
                  evidence['output_match'] = 'FALCON_BEDROCK_OK' in text
                  evidence['output_preview'] = text[:120]
                  print('selected_model=' + selected)
                  print('live_request_verified=true')
                  print('real_output_verified=' + str(bool(text)).lower())
                  print('output_match=' + str(evidence['output_match']).lower())
              else:
                  evidence['error'] = 'no_preferred_model_visible'
                  print('selected_model=none')
          except Exception as exc:
              evidence['error_type'] = type(exc).__name__
              evidence['error'] = str(exc)[:1000]
              print('mantle_error_type=' + type(exc).__name__)
              print('mantle_error=' + str(exc)[:500])
          with open('bedrock-mantle-certification.json','w',encoding='utf-8') as f:
              json.dump(evidence,f,indent=2)
          PY
      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-mantle-certification
          path: bedrock-mantle-certification.json
          retention-days: 14
