services:
  falcon:
    build: .
    restart: unless-stopped
    environment:
      FALCON_STATE_DIR: /data/falcon
      FALCON_INTELLIGENCE_MODE: ${FALCON_INTELLIGENCE_MODE:-auto}
      FALCON_INTELLIGENCE_TIMEOUT: ${FALCON_INTELLIGENCE_TIMEOUT:-60}
      FALCON_DEEPSEEK_API_KEY: ${FALCON_DEEPSEEK_API_KEY:-}
      FALCON_DEEPSEEK_MODEL: ${FALCON_DEEPSEEK_MODEL:-deepseek-v4-pro}
      FALCON_GEMINI_API_KEY: ${FALCON_GEMINI_API_KEY:-}
      FALCON_GEMINI_MODEL: ${FALCON_GEMINI_MODEL:-gemini-3.7-flash}
      FALCON_TELEGRAM_BOT_TOKEN: ${FALCON_TELEGRAM_BOT_TOKEN:-}
      FALCON_TELEGRAM_ALLOWED_USER_ID: ${FALCON_TELEGRAM_ALLOWED_USER_ID:-}
      FALCON_GITHUB_TOKEN: ${FALCON_GITHUB_TOKEN:-}
      FALCON_GITHUB_WRITE_ENABLED: ${FALCON_GITHUB_WRITE_ENABLED:-false}
    volumes:
      - falcon_state:/data/falcon

volumes:
  falcon_state:
